---
layout: none
---

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Widget Backups</title>
<style>
body { font-family: sans-serif; padding: 20px; }
h1 { font-size: 24px; margin-bottom: 10px; }
li { margin: 4px 0; }
</style>
</head>
<body>

<h1>Widget Backups</h1>

<ul>
{% assign zips = site.static_files | where_exp: "f", "f.extname == '.zip'" | sort: "name" | reverse %}
{% for file in zips %}
  <li>
    <a href="{{ file.path | relative_url }}">{{ file.name }}</a>
  </li>
{% endfor %}
</ul>

</body>
</html>
