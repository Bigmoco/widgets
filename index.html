<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Widget Backups</title>
<style>
body { font-family: sans-serif; }
li { margin: 4px 0; }
</style>
</head>
<body>

<h1>Widget Backups</h1>
<ul id="list"></ul>

<script>
fetch(location.href)
  .then(r => r.text())
  .then(html => {
    const ul = document.getElementById("list");
    const matches = html.match(/href="([^"]+\.zip)"/gi) || [];

    const files = [...new Set(
      matches.map(m => m.split('"')[1])
    )].sort();

    files.forEach(name => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = name;
      a.textContent = name;
      li.appendChild(a);
      ul.appendChild(li);
    });
  });
</script>

</body>
</html>
