---
layout: none
---

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Widget Backups</title>
<style>
body { font-family: sans-serif; }
li { margin: 4px 0; }
</style>
</head>
<body>

<h1>Widget Backups</h1>

<ul>
{% assign zips = site.static_files | where_exp: "f", "f.extname == '.zip'" %}
{% for file in zips %}
  <li>
    <a href="{{ file.path }}">{{ file.name }}</a>
  </li>
{% endfor %}
</ul>

</body>
</html>
